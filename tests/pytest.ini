[pytest]
testpaths = api robot
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
markers =
    api: API测试
    ui: UI测试
    db: 数据库测试
    slow: 慢速测试
    integration: 集成测试
    unit: 单元测试
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning