# 服务器配置
server.port=8080

# 文件上传配置
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# 数据库连接配置（先连接到MySQL服务器创建数据库）
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hr_system}?useUnicode=true&characterEncoding=utf8&serverTimezone=${DB_TIMEZONE:Asia/Shanghai}&allowPublicKeyRetrieval=true&useSSL=${DB_USE_SSL:false}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:p@ssw0rd}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

